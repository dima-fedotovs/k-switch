name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  security-events: write
  packages: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    name: Publish verified release
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      - id: version
        run: node .build/scripts/release-tools.js validate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - run: cd release-assets && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/k-switch@bug.guru.shell-extension.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=()
          if test "$PRERELEASE" = true; then args+=(--prerelease); fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Install the attached extension ZIP with `gnome-extensions install --force k-switch@bug.guru.shell-extension.zip`.
          Requires GNOME Shell 50. Log out and sign in if GNOME has not discovered the extension or to load updated Shell code.
          Verify downloads with `sha256sum --check SHA256SUMS` and `gh attestation verify k-switch@bug.guru.shell-extension.zip --repo dima-fedotovs/k-switch`.
          The CycloneDX inventory covers npm build/development dependencies, which are not bundled in the extension ZIP.
          NOTES
          node .build/scripts/release-tools.js verify-tag
          gh release create "$TAG" release-assets/* --verify-tag --title "K-switch $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
