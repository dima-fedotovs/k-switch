name: Prepare GNOME 50
description: Install the pinned Node line and GNOME 50 test dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gjs gnome-shell libglib2.0-bin gnome-settings-daemon gir1.2-adw-1 xvfb xauth imagemagick dbus-x11 ibus libegl1-mesa-dev libgles2-mesa-dev
        gnome-shell --version | tee "$RUNNER_TEMP/gnome-version.txt"
        grep -Eq 'GNOME Shell 50\.' "$RUNNER_TEMP/gnome-version.txt"
    - shell: bash
      run: npm ci
