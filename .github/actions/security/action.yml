name: Prepare security tools
description: Install hash-locked scanner dependencies and a checksum-pinned secret scanner
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: security/requirements.txt
    - shell: bash
      run: |
        sudo apt-get install -y libicu-dev pkg-config
        python -m pip install --require-hashes -r security/requirements.txt
        mkdir -p "$RUNNER_TEMP/security-bin"
        curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-bin" gitleaks
        curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/security-bin" actionlint
        echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
        echo "SCANCODE_CACHE=$RUNNER_TEMP/scancode-cache" >> "$GITHUB_ENV"
        echo "SCANCODE_LICENSE_INDEX_CACHE=$RUNNER_TEMP/scancode-index" >> "$GITHUB_ENV"
