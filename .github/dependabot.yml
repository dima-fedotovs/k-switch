version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-compatible:
        update-types: [minor, patch]
    ignore:
      # These majors require a coordinated runtime/tooling migration.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /security
    schedule:
      interval: weekly
    # Update hashed pins directly: pip-compile needs ICU to inspect PyICU,
    # which is unavailable in Dependabot's standard updater image.
    exclude-paths:
      - requirements.in
      - shexli-requirements.in
